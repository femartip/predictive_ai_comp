#   thinking - post-trained to reason before answering, including models where thinking can be switched off
#              (Qwen3, Gemini 2.5 Flash). Whether a given run thought is the separate `thinking` column.
# thinking is the model's default: true (always reasons), false (never), null (switchable, set per run by the
#   preprocessing scripts). provider and release_date fill the subject fields only where the build leaves them
#   blank; the build's own values take precedence. null = unknown or not verified.

